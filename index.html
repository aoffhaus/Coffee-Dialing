function viewSettings() {
  const s = state.settings;
  const D = s.defaults;
  const tStep = tUnit() === 'F' ? 1 : 0.5, tDec = tUnit() === 'F' ? 0 : 1;
  const setStepper = (field, label, unit, obj, key, step, dec, extra = {}) => Stepper(Object.assign({
    field, label, unit, step, decimals: dec, min: 0,
    get: () => obj[key], set: (v) => { if (v != null) obj[key] = v; }, onChange: persistSettingsSoon
  }, extra));
  const tempStepper = (field, obj) => Stepper({
    field, label: 'Water temp', unit: '°' + tUnit(), step: tStep, decimals: tDec,
    get: () => tempToDisplay(obj.tempC), set: (v) => { if (v != null) obj.tempC = tempFromDisplay(v); }, onChange: persistSettingsSoon
  });
  const hasSample = ['beans', 'grinders', 'brewers', 'brews'].some((k) => state[k].some((x) => x.sample));
  const storageMsg = {
    indexeddb: 'Your data is saved in this browser (IndexedDB).',
    localstorage: 'Your data is saved in this browser (localStorage).',
    memory: 'This browser is blocking storage, so changes are lost when the page closes. Export before leaving.'
  }[Store.backend];

  const exportBox = h('textarea', { class: 'json-box', id: 'export-box', rows: 6, readonly: true, hidden: true, 'aria-label': 'Exported JSON' });
  const importBox = h('textarea', { class: 'json-box', id: 'imp-text', rows: 4, placeholder: 'Paste exported JSON here, or choose a file' });
  const fileInput = h('input', {
    type: 'file', id: 'imp-file', accept: 'application/json,.json',
    onchange: (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = () => { importBox.value = String(rd.result || ''); toast(`Loaded ${file.name}. Choose merge or replace, then Import.`); };
      rd.onerror = () => toast('Could not read that file.', 'warn');
      rd.readAsText(file);
    }
  });

  return h('div', { class: 'stack' },
    h('h1', { class: 'page-title' }, 'Settings'),

    h('section', { class: 'card' },
      h('div', { class: 'title-row' }, h('h2', { class: 'sec-title' }, 'Grinders'),
        h('button', { class: 'btn btn-secondary btn-sm', type: 'button', onclick: () => openGrinderForm(null) }, 'Add grinder')),
      state.grinders.length
        ? h('div', { class: 'list' }, state.grinders.map((g) => ListRow(g.name, `Step ${g.step} · ${g.finerIsLower !== false ? 'lower number = finer' : 'higher number = finer'}`, () => openGrinderForm(g), () => deleteEquipment('grinders', g))))
        : h('p', { class: 'note' }, 'No grinders yet.')),

    h('section', { class: 'card' },
      h('div', { class: 'title-row' }, h('h2', { class: 'sec-title' }, 'Brewers'),
        h('button', { class: 'btn btn-secondary btn-sm', type: 'button', onclick: () => openBrewerForm(null) }, 'Add brewer')),
      state.brewers.length
        ? h('div', { class: 'list' }, state.brewers.map((b) => ListRow(b.name, b.type === 'espresso' ? 'Espresso machine' : 'Pour-over dripper', () => openBrewerForm(b), () => deleteEquipment('brewers', b))))
        : h('p', { class: 'note' }, 'No brewers yet.')),

    h('section', { class: 'card' },
      h('h2', { class: 'sec-title' }, 'Temperature unit'),
      Seg([{ value: 'F', label: '°F' }, { value: 'C', label: '°C' }], tUnit(), (v) => { s.tempUnit = v; persist('settings'); render(); }, { label: 'Temperature unit' })),

    h('section', { class: 'card' },
      h('h2', { class: 'sec-title' }, 'Default recipes'),
      h('p', { class: 'note' }, 'Used for the first brew of a method. After that, the form starts from your last brew.'),
      h('span', { class: 'lbl' }, 'Espresso'),
      h('div', { class: 'grid2 grid3' },
        setStepper('def-e-dose', 'Dose', 'g', D.espresso, 'dose', 0.5, 1),
        setStepper('def-e-yield', 'Yield', 'g', D.espresso, 'yield', 1, 1),
        tempStepper('def-e-temp', D.espresso)),
      h('span', { class: 'lbl' }, 'Pour-over'),
      h('div', { class: 'grid2 grid3' },
        setStepper('def-p-water', 'Total water', 'g', D.pourover, 'water', 10, 0),
        setStepper('def-p-ratio', 'Ratio', '1:x', D.pourover, 'ratio', 0.5, 1, { min: 1 }),
        tempStepper('def-p-temp', D.pourover))),

    h('section', { class: 'card' },
      h('h2', { class: 'sec-title' }, 'Backup & move data'),
      h('p', { class: 'note' }, storageMsg),
      h('p', { class: 'note mono' }, `${state.beans.length} beans · ${state.brews.length} brews · ${state.grinders.length} grinders · ${state.brewers.length} brewers`),
      h('span', { class: 'lbl' }, 'Export'),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn btn-secondary', type: 'button', onclick: exportDownload }, 'Download JSON'),
        h('button', { class: 'btn btn-secondary', type: 'button', onclick: exportCopy }, 'Copy JSON')),
      h('p', { class: 'note' }, 'Inside Claude, downloads are blocked. Use Copy JSON and save the text as a .json file. On your own hosted copy, Download works.'),
      exportBox,
      h('span', { class: 'lbl' }, 'Import'),
      h('label', { class: 'btn btn-secondary file-label', for: 'imp-file' }, 'Choose a JSON file', fileInput),
      importBox,
      SegLive([{ value: 'merge', label: 'Merge' }, { value: 'replace', label: 'Replace all' }], () => ui.importMode, (v) => { ui.importMode = v; }, 'Import mode'),
      h('p', { class: 'note' }, 'Merge adds new items and keeps the newer version of any item in both. Replace all deletes what is here first.'),
      h('button', { class: 'btn btn-primary', type: 'button', onclick: doImport }, 'Import')),

    h('section', { class: 'card' },
      h('h2', { class: 'sec-title' }, 'Clean up'),
      hasSample ? h('button', { class: 'btn btn-secondary', type: 'button', onclick: removeSampleData }, 'Remove example data') : null,
      h('button', { class: 'btn btn-danger-ghost', type: 'button', onclick: clearAllData }, 'Delete all data')));
}

function openGrinderForm(g) {
  const isNew = !g;
  const f = g ? clone(g) : { name: '', step: 1, finerIsLower: true };
  const err = h('div', { class: 'form-err', role: 'alert' });
  const stepInput = h('input', { class: 'input', id: 'g-step', inputmode: 'decimal', value: String(f.step) });
  const quick = SegLive([0.1, 0.25, 0.5, 1, 2].map((v) => ({ value: v, label: String(v) })), () => f.step, (v) => { f.step = v; stepInput.value = String(v); }, 'Common step sizes');
  stepInput.addEventListener('input', () => { const n = num(stepInput.value); if (n > 0) { f.step = n; quick.sync(); } });
  const body = [
    Field('Name', h('input', { class: 'input', id: 'g-name', value: f.name, placeholder: 'e.g. Niche Zero', oninput: (e) => { f.name = e.target.value; } }), 'g-name'),
    h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'g-step' }, 'Grind step size'), quick, stepInput,
      h('div', { class: 'hint' }, 'The smallest change you make on this grinder. Suggestions move in multiples of it.')),
    h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Direction'),
      SegLive([{ value: true, label: 'Lower = finer' }, { value: false, label: 'Higher = finer' }], () => f.finerIsLower, (v) => { f.finerIsLower = v; }, 'Grind direction')),
    err
  ];
  const save = async () => {
    f.name = (f.name || '').trim();
    if (!f.name) { err.textContent = 'Give the grinder a name.'; return; }
    if (!(f.step > 0)) { err.textContent = 'Step size must be more than 0.'; return; }
    f.updatedAt = Date.now();
    if (isNew) { f.id = uid(); state.grinders.push(f); if (!state.settings.lastGrinderId) state.settings.lastGrinderId = f.id; }
    else { const i = state.grinders.findIndex((x) => x.id === f.id); if (i >= 0) state.grinders[i] = f; }
    if (ui.draft && !ui.draft.grinderId) ui.draft.grinderId = f.id;
    await persist('grinders', 'settings');
    closeSheet(true);
    render();
  };
  openSheet(isNew ? 'Add grinder' : 'Edit grinder', body, [
    h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => closeSheet() }, 'Cancel'),
    h('button', { class: 'btn btn-primary', type: 'button', onclick: save }, 'Save')
  ]);
}

function openBrewerForm(b) {
  const isNew = !b;
  const f = b ? clone(b) : { name: '', type: 'pourover' };
  const err = h('div', { class: 'form-err', role: 'alert' });
  const body = [
    Field('Name', h('input', { class: 'input', id: 'w-name', value: f.name, placeholder: 'e.g. V60 02, Kalita 185, Linea Mini', oninput: (e) => { f.name = e.target.value; } }), 'w-name'),
    h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Type'),
      SegLive([{ value: 'espresso', label: 'Espresso machine' }, { value: 'pourover', label: 'Pour-over dripper' }], () => f.type, (v) => { f.type = v; }, 'Brewer type')),
    err
  ];
  const save = async () => {
    f.name = (f.name || '').trim();
    if (!f.name) { err.textContent = 'Give the brewer a name.'; return; }
    f.updatedAt = Date.now();
    if (isNew) { f.id = uid(); state.brewers.push(f); }
    else { const i = state.brewers.findIndex((x) => x.id === f.id); if (i >= 0) state.brewers[i] = f; }
    if (ui.draft && !ui.draft.brewerId && ui.draft.method === f.type) ui.draft.brewerId = f.id;
    await persist('brewers');
    closeSheet(true);
    render();
  };
  openSheet(isNew ? 'Add brewer' : 'Edit brewer', body, [
    h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => closeSheet() }, 'Cancel'),
    h('button', { class: 'btn btn-primary', type: 'button', onclick: save }, 'Save')
  ]);
}

async function deleteEquipment(kind, item) {
  const key = kind === 'grinders' ? 'grinderId' : 'brewerId';
  const used = state.brews.filter((b) => b[key] === item.id).length;
  const ok = await confirmDialog(`Delete "${item.name}"?${used ? ` ${used} saved brew${used === 1 ? '' : 's'} will keep their numbers but show no ${kind === 'grinders' ? 'grinder' : 'brewer'}.` : ''}`, 'Delete');
  if (!ok) return;
  state[kind] = state[kind].filter((x) => x.id !== item.id);
  if (ui.draft && ui.draft[key] === item.id) ui.draft[key] = null;
  if (state.settings.lastGrinderId === item.id) state.settings.lastGrinderId = null;
  await persist(kind, 'settings');
  render();
}

/* ---------- Export / import ---------- */
function exportPayload() {
  return JSON.stringify({
    app: 'coffee-dial-in', version: 1, exportedAt: new Date().toISOString(),
    beans: state.beans, grinders: state.grinders, brewers: state.brewers, brews: state.brews, settings: state.settings
  }, null, 2);
}
function exportDownload() {
  try {
    const blob = new Blob([exportPayload()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: `coffee-dial-in-${localDateStr()}.json` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('Download started. If no file appears, use Copy JSON.');
  } catch (e) {
    toast('Download failed. Use Copy JSON instead.', 'warn');
  }
}
function exportCopy() {
  const txt = exportPayload();
  const box = document.getElementById('export-box');
  const showBox = () => { box.value = txt; box.hidden = false; box.focus(); box.select(); };
  try {
    navigator.clipboard.writeText(txt)
      .then(() => toast('Copied. Paste it into a .json file to keep it.'))
      .catch(() => { showBox(); toast('Clipboard is blocked here. The JSON is selected below; copy it manually.', 'warn'); });
  } catch (e) {
    showBox();
    toast('Clipboard is blocked here. The JSON is selected below; copy it manually.', 'warn');
  }
}
function mergeList(cur, inc) {
  const map = new Map(cur.map((x) => [x.id, x]));
  let added = 0, updated = 0;
  for (const it of inc) {
    const ex = map.get(it.id);
    if (!ex) { map.set(it.id, it); added++; }
    else if ((it.updatedAt || 0) > (ex.updatedAt || 0)) { map.set(it.id, it); updated++; }
  }
  return { list: [...map.values()], added, updated };
}
async function doImport() {
  const txt = document.getElementById('imp-text').value.trim();
  if (!txt) { toast('Paste JSON or choose a file first.', 'warn'); return; }
  let data;
  try { data = JSON.parse(txt); } catch (e) { toast('That text is not valid JSON.', 'warn'); return; }
  const kinds = ['beans', 'grinders', 'brewers', 'brews'];
  if (!data || typeof data !== 'object' || !kinds.some((k) => Array.isArray(data[k]))) {
    toast('No beans, brews or equipment found in that JSON.', 'warn');
    return;
  }
  const clean = (k) => (Array.isArray(data[k]) ? data[k] : []).filter((x) => x && typeof x.id === 'string');
  let msg;
  if (ui.importMode === 'replace') {
    const ok = await confirmDialog(`Replace everything here with the imported data? Your current ${state.beans.length} beans and ${state.brews.length} brews will be deleted.`, 'Replace all');
    if (!ok) return;
    for (const k of kinds) state[k] = clean(k);
    state.settings = mergeSettings(data.settings);
    state.settings.onboarded = true;
    msg = `Replaced with ${state.beans.length} beans and ${state.brews.length} brews.`;
  } else {
    let added = 0, updated = 0;
    for (const k of kinds) {
      const r = mergeList(state[k], clean(k));
      state[k] = r.list; added += r.added; updated += r.updated;
    }
    state.settings.onboarded = true;
    msg = `Merged: ${added} added, ${updated} updated.`;
  }
  state.brews.forEach(normalizeBrew);
  ui.draft = null; ui.result = null; ui.editingId = null; ui.beanDetailId = null;
  document.getElementById('imp-text').value = '';
  await persist(...COLLECTIONS);
  render();
  toast(msg);
}

/* ---------- Example data ---------- */
async function loadSampleData() {
  const now = Date.now();
  const daysAgo = (n) => localDateStr(new Date(now - n * 86400000));
  const at = (dAgo, hr, min) => { const d = new Date(now - dAgo * 86400000); d.setHours(hr, min, 0, 0); return d.getTime(); };
  const g = { id: uid(), name: 'Example grinder', step: 0.5, finerIsLower: true, sample: true, updatedAt: now };
  const m = { id: uid(), name: 'Example espresso machine', type: 'espresso', sample: true, updatedAt: now };
  const v = { id: uid(), name: 'V60 (example)', type: 'pourover', sample: true, updatedAt: now };
  const b1 = { id: uid(), name: 'Example: Ethiopia Guji', roaster: 'Sample Roasters', origin: 'Guji, Ethiopia', process: 'natural', roast: 'light', roastDate: daysAgo(13), bagWeight: 250, notes: 'Example bean. Remove it in Settings → Clean up.', status: 'active', sample: true, createdAt: now, updatedAt: now };
  const b2 = { id: uid(), name: 'Example: Colombia Huila', roaster: 'Sample Roasters', origin: 'Huila, Colombia', process: 'washed', roast: 'medium', roastDate: daysAgo(20), bagWeight: 340, notes: '', status: 'active', sample: true, createdAt: now, updatedAt: now };
  state.grinders.push(g); state.brewers.push(m, v); state.beans.push(b1, b2);
  const mk = (o) => {
    const b = Object.assign({ id: uid(), grinderId: g.id, notes: '', sample: true, updatedAt: now }, o);
    b.suggestion = suggest(b);
    b.dialedIn = !!(b.suggestion && b.suggestion.dialedIn);
    state.brews.push(b);
  };
  const esp = (dAgo, grind, yld, time, S, E, rating, notes) => mk({
    ts: at(dAgo, 7, 30), method: 'espresso', beanId: b1.id, brewerId: m.id, grind, dose: 18, yield: yld, time, preinf: 0, tempC: 93,
    taste: { strength: S, extraction: E, rating, notes }
  });
  esp(4, 12, 36, 22, -1, -2, 2, 'Sharp lemon, thin body');
  esp(3, 11, 36, 27, 0, -1, 3, 'Sweeter, still a little tart');
  esp(2, 10.5, 36, 30, 1, 0, 4, 'Syrupy, very intense');
  esp(1, 10.5, 38, 31, 0, 0, 5, 'Blueberry, cocoa, balanced');
  mk({ ts: at(2, 15, 10), method: 'pourover', beanId: b2.id, brewerId: v.id, grind: 22, dose: 15.6, water: 250, bloomWater: 50, bloomTime: 45, brewTime: 205, tempC: 96, taste: { strength: 0, extraction: 1, rating: 3, notes: 'Drying finish' } });
  mk({ ts: at(1, 15, 5), method: 'pourover', beanId: b2.id, brewerId: v.id, grind: 23, dose: 15.6, water: 250, bloomWater: 50, bloomTime: 45, brewTime: 190, tempC: 96, taste: { strength: -1, extraction: 0, rating: 4, notes: 'Clean caramel, a bit light' } });
  state.settings.onboarded = true;
  state.settings.lastGrinderId = g.id;
  ui.draft = null;
  await persist(...COLLECTIONS);
  render();
  toast('Example data loaded.');
}
async function removeSampleData() {
  const ok = await confirmDialog('Remove all example beans, brews and equipment? Your own entries stay.', 'Remove examples');
  if (!ok) return;
  for (const k of ['beans', 'grinders', 'brewers', 'brews']) state[k] = state[k].filter((x) => !x.sample);
  if (!grinderById(state.settings.lastGrinderId)) state.settings.lastGrinderId = null;
  ui.draft = null; ui.result = null; ui.beanDetailId = null; ui.editingId = null;
  await persist(...COLLECTIONS);
  render();
  toast('Example data removed.');
}
async function clearAllData() {
  const ok = await confirmDialog(`Delete all ${state.beans.length} beans, ${state.brews.length} brews and your equipment from this browser? Export first if you want a backup.`, 'Delete everything');
  if (!ok) return;
  state.beans = []; state.grinders = []; state.brewers = []; state.brews = [];
  state.settings = clone(DEFAULT_SETTINGS);
  ui.draft = null; ui.result = null; ui.beanDetailId = null; ui.editingId = null;
  await persist(...COLLECTIONS);
  goTab('brew');
  toast('All data deleted.');
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => goTab(t.dataset.tab)));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });

(async function boot() {
  try { const t = localStorage.getItem(LS_PREFIX + 'tab'); if (VIEWS[t]) ui.tab = t; } catch (e) { /* ignore */ }
  await Store.init();
  for (const k of COLLECTIONS) {
    const v = await Store.get(k);
    if (k === 'settings') state.settings = mergeSettings(v);
    else if (Array.isArray(v)) state[k] = v;
  }
  state.brews.forEach(normalizeBrew);
  render();
})();
</script>
